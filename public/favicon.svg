  <!-- deux esprits qui se rejoignent -->
  <circle cx="24" cy="32" r="15" fill="none" stroke="#ffffff" stroke-width="4"/>
  <circle cx="40" cy="32" r="15" fill="none" stroke="#ffffff" stroke-width="4"/>
